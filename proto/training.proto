syntax = "proto3";

package training;

// Contract between the API gateway (client) and the training-service
// (server, :50071). The training-service owns the working dataset (camera
// captures + YOLO labels + classes), the SAM3-assisted labeling worker and
// the ultralytics training job. Heavy work (torch) always runs in child
// processes; this service is only control-plane.
//
// Dataset images are stored in the geometry the dataset was created with
// (TRAIN_DATASET_IMG_SIZE: 0, the default, keeps the camera frame at native
// resolution; a value > 0 letterboxes it to that square). Either way a JPEG
// stays well under the gRPC message limit, so images travel as unary bytes.

message Empty {}

message Result {
  bool success = 1;
  string message = 2;
}

// ── Datasets ──────────────────────────────────────────────────────────────────
// Multiple datasets live under {DATA_DIR}/datasets/{dataset_id}/. Every
// dataset-scoped RPC carries the dataset_id explicitly — the server keeps no
// "active dataset" state.

message DatasetId { string dataset_id = 1; }
message DatasetName {
  string name = 1;
  // Task the new dataset is labeled for ("detect", "classify", "segment", "face"),
  // fixed at creation from the device's application. Empty = "detect".
  string task = 2;
}
message DatasetRename {
  string dataset_id = 1;
  string name = 2;
}
message DatasetCover {
  string dataset_id = 1;
  string image_id = 2;
}
message DatasetMeta {
  string dataset_id = 1;
  string name = 2;
  double created_at = 3;            // UNIX timestamp
  string cover_image_id = 4;        // resolved server-side: explicit cover if it
                                    // still exists, else first image, else ""
  uint32 image_count = 5;
  uint32 labeled_count = 6;
  uint32 class_count = 7;
  // Task the dataset is labeled for; datasets created before application
  // types existed report "detect".
  string task = 8;
}
message DatasetList { repeated DatasetMeta datasets = 1; }

// A ZIP import: the first `DatasetUploadChunk` must be `meta`; the rest are 1MB
// `chunk`s of the ZIP file. `task` is the device's application task: the
// archive's layout must match it (YOLO `images/` + `labels/` with
// `class cx cy w h` box rows for detect; the same layout with
// `class x1 y1 … xn yn` polygon rows, normalized and at least 3 vertices, for
// segment; one folder per class for classify), and the new dataset records
// it. Empty means `detect`.
message DatasetUploadMeta {
  string name = 1;
  string task = 2;
}
message DatasetUploadChunk {
  oneof payload {
    DatasetUploadMeta meta = 1;
    bytes chunk = 2;
  }
}
message DatasetUploadResult {
  bool success = 1;
  string message = 2;               // user-facing validation error on failure
  DatasetMeta dataset = 3;
}

// Download of a dataset as a ZIP in the exact layout UploadDataset accepts, so
// exports round-trip: YOLO `images/` + `labels/` + `data.yaml` for detect (box
// rows) and segment (one `class x1 y1 … xn yn` polygon row per ring), and
// `train/<class>/` image folders plus `classes.txt` for classify.
message DatasetExportChunk { bytes chunk = 1; }

message DatasetInfo {
  uint32 image_count = 1;
  uint32 labeled_count = 2;         // images with at least one box, polygon
                                    // ring, or an image class (classify)
  repeated string classes = 3;
  uint32 min_images = 4;            // training gate (20)
  string dataset_id = 5;
  string name = 6;
  string cover_image_id = 7;
  string task = 8;                  // see DatasetMeta.task
}

message ImageInfo {
  string image_id = 1;
  double created_at = 2;            // UNIX timestamp
  bool labeled = 3;
  uint32 box_count = 4;             // boxes (detect) or polygon rings (segment)
  bool replica = 5;                // created via ReplicateImage (gallery hint only)
  // The image's class in a `classify` dataset (index into its classes);
  // unset for an unlabeled image and in every other task.
  optional uint32 image_class = 6;
}

// Duplicate one labeled image (image + its labels) `count` times to quickly
// grow the dataset past the training minimum. Rejected for already-replicated
// or unlabeled sources; `count` clamped to 1..50 server-side.
message ReplicateRequest {
  string dataset_id = 1;
  string image_id = 2;
  uint32 count = 3;
}
message ImageList { repeated ImageInfo images = 1; }
message ImageId {
  string image_id = 1;
  string dataset_id = 2;
}
message ImageBlob {
  string image_id = 1;
  bytes jpeg = 2;
  uint32 width = 3;                 // actual stored dimensions (the square for a
  uint32 height = 4;                // letterboxed dataset, native otherwise); 0x0
                                    // when the blob on disk is unreadable and the
                                    // dataset stores native frames (size unknown)
}

// ── Labels (normalized YOLO format, matching the labels/*.txt rows) ──────────

message Box {
  uint32 class_id = 1;
  float cx = 2;                     // all normalized 0..1 on the stored image
  float cy = 3;
  float w = 4;
  float h = 5;
}
// One exterior ring of a segmentation instance. `points` is the flat list
// x1, y1, x2, y2, … of at least 3 vertices, normalized 0..1 on the stored
// image, clockwise in image coordinates and implicitly closed. Rings are
// normalized on the way in (rasterised and re-extracted): holes are dropped,
// tiny components removed, at most 200 vertices per ring and 8 rings per
// instance. `instance` groups the rings of one object; it is not kept in the
// YOLO label file (one line per ring), so rings read back from a dataset get
// one instance each.
message Polygon {
  uint32 class_id = 1;
  uint32 instance = 2;
  repeated float points = 3;
}
// An image's labels. Which kind a dataset accepts follows its task: `detect`
// datasets carry `boxes` only, `segment` datasets `polygons` only, `classify`
// datasets an `image_class` only; any other kind is refused with
// INVALID_ARGUMENT. No label at all is always allowed (a background image for
// detect and segment, excluded from a classify split).
message Labels {
  string image_id = 1;
  repeated Box boxes = 2;
  string dataset_id = 3;
  // The rings of a `segment` dataset.
  repeated Polygon polygons = 4;
  // The whole-image class of a `classify` dataset (index into its classes);
  // unset when the image has no class.
  optional uint32 image_class = 5;
}

// ── Pre-labeled image ingest (hub detection records → dataset) ───────────────

// A pre-label carried by class name; coordinates are normalized corners on the
// uploaded image. The service maps them into the dataset's stored geometry
// (letterbox space, or unchanged for a native-resolution dataset) and resolves
// the class by name, appending it when missing.
message NamedBox {
  string class_name = 1;
  float x1 = 2;                     // all normalized 0..1 on the uploaded image
  float y1 = 3;
  float x2 = 4;
  float y2 = 5;
}

// A segmentation pre-label carried by class name: one exterior ring (flat
// x1, y1, x2, y2, … normalized 0..1 on the uploaded image), mapped into the
// dataset's stored geometry and class list like NamedBox; `instance` groups
// the rings of one object.
message NamedPolygon {
  string class_name = 1;
  uint32 instance = 2;
  repeated float points = 3;
}

// One externally captured image (e.g. a hub detection record's clean frame)
// plus its pre-labels. On ingest the JPEG is stored in the dataset's geometry
// like a camera capture (letterboxed, or kept at its own resolution); a
// dataset recorded with a different geometry than the service's current
// TRAIN_DATASET_IMG_SIZE is refused with FAILED_PRECONDITION. Unary: snapshot
// JPEGs stay far below the gRPC message cap.
message LabeledImageUpload {
  string dataset_id = 1;
  bytes jpeg = 2;                   // original JPEG, as captured
  repeated NamedBox boxes = 3;
  // The rings of a `segment` dataset.
  repeated NamedPolygon polygons = 4;
  // The whole-image class of a `classify` dataset, by name: resolved against
  // the dataset's classes and appended when missing, exactly like
  // NamedBox.class_name. Empty means no class. Boxes, polygons and the image
  // class are mutually exclusive (the dataset's task decides which kind is
  // accepted).
  string image_class = 5;
}

// ── Classes ───────────────────────────────────────────────────────────────────

message ClassName {
  string name = 1;
  string dataset_id = 2;
}
message ClassEdit {
  uint32 index = 1;
  string name = 2;
  string dataset_id = 3;
}
message ClassIndex {
  uint32 index = 1;
  string dataset_id = 2;
}
message ClassList { repeated string classes = 1; }

// ── SAM-assisted labeling ─────────────────────────────────────────────────────

message SamStatus {
  bool available = 1;               // sam3 importable + checkpoint present
  bool loaded = 2;                  // worker subprocess alive with model on GPU
  string message = 3;
}
message Point {
  float x = 1;                      // normalized 0..1
  float y = 2;
  bool positive = 3;                // false = negative/background click
}
message SamRequest {
  string image_id = 1;
  string text_prompt = 2;           // concept prompt, e.g. "bottle" (optional)
  repeated Point points = 3;        // click prompts (optional)
  float threshold = 4;              // confidence threshold 0..1 (0 → worker default 0.5)
  string dataset_id = 5;
}
message SamResult {
  bool success = 1;
  string message = 2;
  repeated Box boxes = 3;           // class_id is unset — suggestions only
  repeated float scores = 4;        // parallel to boxes
  // The object masks as normalized rings (class_id unset); `instance` is the
  // index into boxes/scores, so a mask whose rings were all dropped simply has
  // none here.
  repeated Polygon polygons = 5;
}

// ── Training job (single job at a time) ──────────────────────────────────────

message TrainRequest {
  string model_name = 1;            // mandatory; best.pt becomes {model_name}.pt
                                    // (optional when federated — no upload happens)
  uint32 epochs = 2;                // 0 → default (50)
  uint32 batch = 3;                 // 0 → default (env TRAIN_BATCH)
  string dataset_id = 4;            // dataset to train on (mandatory)
  uint32 patience = 5;              // early-stop after N epochs w/o improvement
                                    // (0 → default 50)
  string initial_weights_id = 6;    // start from a stashed checkpoint (UploadWeights)
                                    // instead of the baked-in base weights
  bool federated = 7;               // federated round: stash last.pt as
                                    // result_weights_id and skip the model upload
  // Fine-tune from an existing device model: a ModelControl.ListModels name
  // (e.g. "X.engine") with has_weights, whose checkpoint sidecar (the last
  // best.pt it was built from) is fetched through the gateway. Exclusive with
  // initial_weights_id; empty → the baked-in base weights.
  string base_model = 8;
}

message TrainingJob {
  string job_id = 1;
  string status = 2;                // idle/preparing/training/uploading/done/failed/canceled
  uint32 progress = 3;              // 0-100
  uint32 epoch = 4;
  uint32 total_epochs = 5;
  string message = 6;
  string error = 7;
  string model_name = 8;
  string conversion_job_id = 9;     // inference-service conversion job (when done)
  string metrics_json = 10;         // last-epoch ultralytics metrics, relayed verbatim
  double started_at = 11;
  string dataset_id = 12;           // dataset the job trains on
  string result_weights_id = 13;    // federated job, status "done": the stashed
                                    // last.pt, ready for DownloadWeights
  bool federated = 14;              // job runs as a federated round
  string base_model = 15;           // the TrainRequest.base_model the job started from
  string geometry = 16;             // effective training geometry once the split is
                                    // built: "frames" | "tiles:auto" | "tiles:<px>" (the
                                    // ModelUploadMeta.train_geometry vocabulary); empty
                                    // while preparing
}

// ── Federated training (hub-orchestrated FedAvg) ─────────────────────────────
// The hub shards one dataset across the paired devices, trains each shard
// locally per round from shared weights, and averages the resulting
// checkpoints on one device. Devices never talk to each other — the hub
// ferries weights as opaque .pt blobs. Blobs are stashed under
// {DATA_DIR}/weights/{weights_id}.pt and pruned after a TTL.

// Deterministic IID shard of a dataset: images are shuffled with `seed` and
// assigned round-robin, so the N shards (same seed) are disjoint, cover the
// full dataset and differ in size by at most one image. The exported ZIP has
// the same YOLO layout as ExportDataset, always carrying the full class
// list so per-shard checkpoints stay averageable.
message ShardExportRequest {
  string dataset_id = 1;
  uint32 num_shards = 2;            // total shards (2..16)
  uint32 shard_index = 3;           // 0-based, < num_shards
  string seed = 4;                  // shared shuffle seed (same for all shards)
}

// Checkpoint upload into the weights stash (initial weights for a federated
// round). The first WeightsChunk must be `meta`; the rest are 1MB `chunk`s of
// the .pt file. `name` is a diagnostic label only; `task` is the task the
// checkpoint was trained for, checked against the dataset's task when the job
// starts (empty means unchecked).
message WeightsUploadMeta {
  string name = 1;
  string task = 2;
}
message WeightsChunk {
  oneof payload {
    WeightsUploadMeta meta = 1;
    bytes chunk = 2;
  }
}
message WeightsUploadResult {
  bool success = 1;
  string message = 2;               // user-facing validation error on failure
  string weights_id = 3;
  uint64 size = 4;                  // stored bytes
}
message WeightsId { string weights_id = 1; }
message WeightsDownloadChunk { bytes chunk = 1; }

// Average N stashed checkpoints (FedAvg): float tensors of the model (and
// ema) state dicts are averaged in fp32 and cast back; non-float buffers are
// kept from the first checkpoint; optimizer state is dropped. Runs in a CPU
// child process and is synchronous — seconds for a handful of checkpoints.
message AverageRequest { repeated string weights_ids = 1; }  // at least two
message AverageResult {
  bool success = 1;
  string message = 2;
  string weights_id = 3;            // freshly stashed averaged checkpoint
}

// ── Events (relayed by the gateway onto its unified SSE bus) ─────────────────

message Event {
  uint64 version = 1;
  string type = 2;
  double timestamp = 3;
  string source = 4;
  repeated string keys = 5;
  string data = 6;                  // JSON-encoded payload
}

service TrainingControl {
  // Dataset registry
  rpc ListDatasets(Empty) returns (DatasetList);
  rpc CreateDataset(DatasetName) returns (DatasetMeta);
  rpc RenameDataset(DatasetRename) returns (DatasetMeta);
  rpc DeleteDataset(DatasetId) returns (Result);     // rejected while the dataset trains
  rpc SetDatasetCover(DatasetCover) returns (Result);
  rpc UploadDataset(stream DatasetUploadChunk) returns (DatasetUploadResult);
  rpc ExportDataset(DatasetId) returns (stream DatasetExportChunk);

  // Dataset / capture
  rpc GetDataset(DatasetId) returns (DatasetInfo);
  rpc CaptureImage(DatasetId) returns (ImageInfo);
  rpc AddDatasetImage(LabeledImageUpload) returns (ImageInfo);
  rpc ListImages(DatasetId) returns (ImageList);
  rpc GetImage(ImageId) returns (ImageBlob);
  rpc DeleteImage(ImageId) returns (Result);
  rpc ReplicateImage(ReplicateRequest) returns (Result);

  // Labels
  rpc GetLabels(ImageId) returns (Labels);
  rpc SetLabels(Labels) returns (Result);

  // Classes
  rpc GetClasses(DatasetId) returns (ClassList);
  rpc AddClass(ClassName) returns (ClassList);
  rpc RenameClass(ClassEdit) returns (ClassList);
  // Drops that class's boxes or polygon rings (a classify image of that class
  // becomes unlabeled) and reindexes the rest.
  rpc RemoveClass(ClassIndex) returns (ClassList);

  // SAM-assisted labeling
  rpc GetSamStatus(Empty) returns (SamStatus);
  rpc LoadSam(Empty) returns (Result);
  rpc UnloadSam(Empty) returns (Result);
  rpc SamSegment(SamRequest) returns (SamResult);

  // Training
  rpc StartTraining(TrainRequest) returns (TrainingJob);
  rpc GetTraining(Empty) returns (TrainingJob);
  rpc CancelTraining(Empty) returns (Result);     // hard stop; model discarded
  rpc FinishTraining(Empty) returns (Result);     // graceful early stop; keeps best.pt

  // Federated training (hub-orchestrated FedAvg)
  rpc ExportDatasetShard(ShardExportRequest) returns (stream DatasetExportChunk);
  rpc UploadWeights(stream WeightsChunk) returns (WeightsUploadResult);
  rpc DownloadWeights(WeightsId) returns (stream WeightsDownloadChunk);
  rpc AverageWeights(AverageRequest) returns (AverageResult);
  rpc DeleteWeights(WeightsId) returns (Result);

  // Telemetry
  rpc StreamEvents(Empty) returns (stream Event);
}
