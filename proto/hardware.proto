syntax = "proto3";

package hardware;

// gRPC contract between the api-gateway (client) and the `os-base` hardware
// agent (server). The agent owns all host hardware access: network/Wi-Fi
// configuration (systemd-networkd + wpa_supplicant), GPIO, system metrics,
// power and the system clock.

message Empty {}

// Generic result for write/apply operations.
message Result {
  bool success = 1;
  string message = 2;
}

// ── Network / IP ────────────────────────────────────────────────────────────

// Which managed interface a request targets.
enum Interface {
  WIRED = 0;
  WIFI = 1;
}

// IPv4 state of a single managed interface.
message InterfaceConfig {
  string name = 1;             // host interface name (e.g. "enP8p1s0", "wlP1p1s0")
  string method = 2;           // "auto" (DHCP) or "static"
  string address = 3;          // empty when unknown / DHCP not yet leased
  uint32 prefix = 4;           // subnet prefix length (0 when unknown)
  string gateway = 5;
  repeated string dns = 6;
  bool present = 7;            // false when no such interface exists on the host
}

// Current Wi-Fi association state (subset of wpa_supplicant's STATUS).
message WifiStatus {
  string ssid = 1;             // associated SSID ("" when not connected)
  string state = 2;            // wpa_state, e.g. "COMPLETED", "SCANNING", "DISCONNECTED"
  int32 signal = 3;            // RSSI dBm of the current BSS (0 when unknown)
}

// Full snapshot returned by GetNetworkConfig.
message NetworkConfig {
  InterfaceConfig wired = 1;
  InterfaceConfig wifi = 2;    // IP config of the wireless interface
  WifiStatus wifi_status = 3;  // association state of the wireless interface
}

message IpConfigRequest {
  Interface interface = 1;
  string method = 2;           // "auto" or "static"
  string address = 3;          // required when method == "static"
  uint32 prefix = 4;           // required when method == "static"
  string gateway = 5;          // optional
  repeated string dns = 6;     // optional
}

// ── Wi-Fi ─────────────────────────────────────────────────────────────────

message WifiNetwork {
  string ssid = 1;
  int32 signal = 2;            // RSSI dBm (higher/closer to 0 is stronger)
  string security = 3;         // "WPA3" | "WPA2" | "WEP" | "OPEN"
  bool in_use = 4;             // currently associated
  bool saved = 5;              // a network block already exists for this SSID
}

message WifiScanResult {
  repeated WifiNetwork networks = 1;
}

message WifiConnectRequest {
  string ssid = 1;
  string password = 2;         // empty for open networks
}

message WifiConnectResult {
  bool success = 1;
  string state = 2;            // final wpa_state (e.g. "COMPLETED")
  string message = 3;
}

message WifiForgetRequest {
  string ssid = 1;
}

// ── Wi-Fi access point ─────────────────────────────────────────────────────
//
// The device can turn its single radio into a WPA2 access point so a remote
// camera running the Conecsa camera app can join it directly, with no router
// on site. While the access point is up the device is **off its Wi-Fi network**: the hub
// reaches it over the wired port only. The agent therefore requires a wired
// link with an IPv4 address (link-local included: a hub on a direct cable has
// nothing else) before starting, never persists the access
// point (an agent restart or a reboot returns the radio to station mode) and
// stops it by itself when no remote camera has joined within five minutes.

// One remote camera (station) joined to the access point. Identified by the
// address the device's DHCP server leased it — never by its hardware address.
message ApStation {
  string address = 1;          // leased IPv4 address, "" while the lease is pending
  string hostname = 2;         // as sent in the DHCP request, "" when none
  int32 signal = 3;            // RSSI dBm as seen by the device (0 when unknown)
}

// State of the access point (GetApStatus). Never carries the passphrase.
message ApStatus {
  bool active = 1;             // the radio is an access point with an address
  string ssid = 2;             // the network name served ("" when inactive)
  uint32 frequency_mhz = 3;    // 5180 / 5200 / 5220 / 5240 for channels 36 / 40 / 44 / 48
  string address = 4;          // the device's address on the access point
  uint32 prefix = 5;
  repeated ApStation stations = 6;
  // Seconds left before the access point stops for lack of a remote camera. 0
  // once one has joined (a later disconnect does not stop it) and when inactive.
  uint32 join_deadline_remaining_secs = 7;
  bool wired_ready = 8;        // the wired precondition (carrier + an IPv4 address) holds now
  string message = 9;          // why the last start or stop ended the way it did
  // Channels (36, 40, 44, 48) the radio may start a network on right now. The
  // regulatory NO_IR flag moves with the beacons the driver has heard, so this
  // changes over time; empty when the daemon cannot say.
  repeated uint32 channels = 10;
}

// StartAp parameters. The channel is 36, 40, 44 or 48 (the non-DFS block), or
// 0 for automatic: the agent then takes a channel the radio may initiate a
// network on right now, preferring the one the station link uses. An explicit
// channel that is blocked at the moment (NO_IR) is refused before the radio
// is touched, naming the usable ones.
message ApRequest {
  string ssid = 1;             // 1–32 bytes of UTF-8
  string passphrase = 2;       // WPA2 passphrase, 8–63 printable ASCII characters
  uint32 channel = 3;          // 36 / 40 / 44 / 48, or 0 = automatic
}

// ── GPIO ─────────────────────────────────────────────────────────────────────
// Output pins 29, 31 and 33 (BOARD numbering) are digital outputs driven on
// demand over gRPC. The pin-7 trigger gate is read per frame from the GPIO SHM
// channel, not over gRPC.

// Current driven level of a single output pin (BOARD numbering).
message GpioPinState {
  uint32 pin = 1;
  bool level = 2;              // true = HIGH, false = LOW
}

message GpioStatus {
  bool available = 1;
  bool enabled = 2;            // trigger/gate mode on
  reserved 3;                  // was count
  repeated GpioPinState pins = 4;  // current level of each controllable output pin
}

message GpioTriggerRequest {
  bool enabled = 1;
}

// Drive a single output pin HIGH/LOW.
message GpioPinRequest {
  uint32 pin = 1;
  bool level = 2;             // true = HIGH, false = LOW
}

// ── System metrics (host introspection — CPU/RAM/disk/temp/GPU from sysfs) ────
// The `optional` floats are absent when the sensor/metric is unavailable, so
// the gateway can relay JSON `null`.
message SystemStatus {
  float  cpu_usage = 1;            // percent
  float  ram_usage = 2;            // percent
  uint64 ram_total = 3;            // bytes
  uint64 ram_used = 4;
  float  disk_usage = 5;           // percent
  uint64 disk_total = 6;
  uint64 disk_used = 7;
  optional float temperature = 8;       // °C (CPU/SoC)
  optional float gpu_usage = 9;         // percent
  optional float gpu_temperature = 10;  // °C
  optional float gpu_freq_mhz = 11;
  optional float gpu_max_freq_mhz = 12;
}

// ── System power (shutdown / restart the host) ────────────────────────────

// Valid values for action: "shutdown" | "restart"
message SystemPowerRequest {
  string action = 1;
}

message SystemPowerResult {
  bool success = 1;
  string message = 2;
}

// ── System clock ──────────────────────────────────────────────────────────

// The hub's wall clock, relayed by the api-gateway so a device whose RTC lost
// time (the Jetson has no RTC battery) can be corrected without NTP. Setting
// the clock is a host operation, so it belongs to the privileged agent.
message SystemTimeRequest {
  int64 epoch_millis = 1;  // UTC milliseconds since the epoch
  string source = 2;       // "pairing" | "hub-poll" — for the log line only
}

// ── Service ─────────────────────────────────────────────────────────────────

service HardwareService {
  // Network / IP
  rpc GetNetworkConfig(Empty) returns (NetworkConfig);
  rpc SetIpConfig(IpConfigRequest) returns (Result);

  // Wi-Fi
  rpc ScanWifi(Empty) returns (WifiScanResult);
  rpc ConnectWifi(WifiConnectRequest) returns (WifiConnectResult);
  rpc ForgetWifi(WifiForgetRequest) returns (Result);
  // Wi-Fi access point for the remote camera (see ApStatus). StartAp is
  // rollback-safe: any failed step returns the radio to station mode.
  rpc GetApStatus(Empty) returns (ApStatus);
  rpc StartAp(ApRequest) returns (Result);
  rpc StopAp(Empty) returns (Result);

  // GPIO control. The pin-7 trigger gate uses SHM per-frame; the rest are
  // config/event-style ops served here: enable the gate, drive output pins,
  // and read availability + current pin levels.
  rpc GetGpioStatus(Empty) returns (GpioStatus);
  rpc SetGpioTrigger(GpioTriggerRequest) returns (Result);
  rpc SetGpioPin(GpioPinRequest) returns (Result);

  // System metrics (CPU/RAM/disk/temperature/GPU)
  rpc GetSystemStatus(Empty) returns (SystemStatus);

  // System power (shutdown / restart the host)
  rpc SystemPower(SystemPowerRequest) returns (SystemPowerResult);

  // System clock (hub-driven, for hosts with no RTC battery and no NTP)
  rpc SetSystemTime(SystemTimeRequest) returns (Result);
}
