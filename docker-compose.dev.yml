# ============================================================================
# DEV stack for x86_64 + NVIDIA GPU — a faithful mirror of the production
# docker-compose.yml that reuses the SAME service Dockerfiles and the SAME
# behavior, substituting only the parts that are exclusive to the Jetson:
#
#   - os-base       → builds Dockerfile.os-base.dev (x86 PyPI tensorrt-cu12/pycuda
#                     instead of the aarch64 jetson-ai-lab wheels) and runs as a
#                     plain base/volume-owner (the `os-base` hardware agent
#                     runs only on the Jetson).
#   - system-vision → builds Dockerfile.system-vision.dev (x86_64 Tailwind binary).
#   - inference /   → REMOVE `runtime: nvidia`, the Tegra host-library bind-mounts,
#     training        the aarch64 LD_LIBRARY_PATH / jemalloc LD_PRELOAD and the
#                     GPIO SHM channel volume (all Jetson-specific); GPU comes from the
#                     NVIDIA container toolkit via `deploy.resources`.
#   - host ports    → api-gateway :5000, system-vision :80 (plus :443) and flow
#                     :1880 (editor without tokens, FLOW_ADMIN_AUTH=0) are
#                     published for local access; production publishes only :443.
#
# Everything else (webcam-server, api-gateway, flow, the service Dockerfiles,
# the compose-network service-name wiring, volumes) is reused unchanged.
#
#   docker compose -f docker-compose.dev.yml up -d --build
# ============================================================================

services:
  os-base:
    image: conecsa-os-base:dev
    build:
      context: .
      dockerfile: os-base/Dockerfile.os-base.dev
    container_name: conecsa-os-base
    # The `os-base` hardware agent (GPIO/Wi-Fi/network) runs only on the device;
    # off-device `os-base` is just the shared base image + owner of the named
    # data volumes.
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - models-data:/data/models
      - runs-data:/data/runs
    restart: unless-stopped
    networks:
      - conecsa-network

  webcam-server:
    build:
      context: .
      dockerfile: webcam-server/Dockerfile.webcam-server
    container_name: conecsa-webcam-server
    ipc: shareable
    environment:
      - CAMERA_INDEX=0
      - CAPTURE_WIDTH=2560
      - CAPTURE_HEIGHT=720
      - CAPTURE_FRAMERATE=60
      - RUST_LOG=info
      - SHM_NAME=conecsa_frame_shm
      - SHM_SLOT_MIN_BYTES=16777216
      # Start-up capture source, from the shell or .env. `network` pulls the
      # remote camera protocol from webcam-server/tools/mjpeg_test_sender.py;
      # use the workstation's LAN address (loopback is this container).
      - CAMERA_SOURCE=${CAMERA_SOURCE:-local}
      - CAMERA_NETWORK_HOST=${CAMERA_NETWORK_HOST:-}
      - CAMERA_NETWORK_PORT=${CAMERA_NETWORK_PORT:-}
      - CAMERA_NETWORK_TOKEN=${CAMERA_NETWORK_TOKEN:-}
    # privileged grants access to all /dev/video* (incl. hot-plugged nodes) so
    # the server starts with no camera (publishing `no_camera`, no frames) and
    # picks one up when it appears — same as production.
    privileged: true
    restart: unless-stopped
    networks:
      - conecsa-network

  inference-service:
    build:
      context: .
      dockerfile: inference-service/Dockerfile.inference-service
      additional_contexts:
        base: service:os-base
    container_name: conecsa-inference-service
    ipc: "service:webcam-server"
    environment:
      # GPU
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - CUDA_VISIBLE_DEVICES=0
      - CUDA_MODULE_LOADING=LAZY
      - CUDA_LAUNCH_BLOCKING=0
      - PYTHONUNBUFFERED=1
      - SHM_NAME=conecsa_frame_shm
      # Camera defaults — must stay in sync with webcam-server above.
      - CAMERA_INDEX=0
      - CAPTURE_WIDTH=2560
      - CAPTURE_HEIGHT=720
      - CAPTURE_FRAMERATE=60
      - CAPTURE_AUTO_EXPOSURE=false
      - CAPTURE_EXPOSURE_TIME=166
      # 1 so the default TILING_MODE=grid cuts its tiles from native pixels
      # (see docker-compose.yml); 2 only pays off with TILING_MODE=off.
      - PROCESSING_DECODE_SCALE=1
      - YOLO_AUTOINSTALL=false
      - STEREO_COMBINE=none
      - STEREO_BLEND_ALPHA=0.5
      - CAPTURE_RGB_RED=128
      - CAPTURE_RGB_GREEN=128
      - CAPTURE_RGB_BLUE=128
      - CAPTURE_GAMMA=100
      - CAPTURE_GAIN=0
      - TENSORRT_AUTO_REBUILD_ENGINE=1
      - TENSORRT_WORKSPACE_MB=192
      - TENSORRT_CONTEXTS=2
      # Face recognition; see docker-compose.yml for what each value means.
      - FACE_MATCH_THRESHOLD=0.363
      - FACE_MIN_SIZE_PX=40
      - FACE_MAX_FACES=5
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128,garbage_collection_threshold:0.8
    volumes:
      - models-data:/data/models
      - detections-data:/data/detections
    depends_on:
      - os-base
      - webcam-server
    restart: unless-stopped
    networks:
      - conecsa-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50061), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile.api-gateway
      additional_contexts:
        base: service:os-base
    container_name: conecsa-api-gateway
    ipc: "service:webcam-server"
    environment:
      - INFERENCE_GRPC_ADDR=inference-service:50061
      - HARDWARE_AGENT_ADDR=os-base:50051
      - TRAINING_GRPC_ADDR=training-service:50071
      - STEREO_COMBINE=none
      - STEREO_BLEND_ALPHA=0.5
      - SHM_NAME=conecsa_frame_shm
      - PROCESSED_SHM_NAME=conecsa_processed_shm
      - GATEWAY_PORT=5000
      - WAITRESS_THREADS=32
      # Device enrollment: key/CSR under CONECSA_CERT_DIR + /enroll/*. Tokenless
      # pairing by default; set DEVICE_PAIR_TOKEN only to require a shared secret.
      - CONECSA_CERT_DIR=/etc/conecsa/certs
      - DEVICE_PAIR_TOKEN=${DEVICE_PAIR_TOKEN:-}
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET:-conecsa-dev-only-secret}
      # In-container mDNS works on the dev bridge for local hub testing.
      - HUB_MDNS_ENABLED=${HUB_MDNS_ENABLED:-1}
      # Audit trail, drained by the hub over mTLS (same as production).
      - AUDIT_DIR=/data/audit
    ports:
      - "5000:5000"
    volumes:
      - conecsa-certs:/etc/conecsa/certs
      - audit-data:/data/audit
      # Same host hostname → device id unification as production (here the "host"
      # is the dev machine; the in-container mDNS advertises the same id).
      - /etc/hostname:/etc/conecsa/host_hostname:ro
    depends_on:
      - os-base
      - webcam-server
      - inference-service
    restart: unless-stopped
    networks:
      - conecsa-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/v1/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  training-service:
    build:
      context: .
      dockerfile: training-service/Dockerfile.training-service
      additional_contexts:
        base: service:os-base
    container_name: conecsa-training-service
    ipc: "service:webcam-server"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - CUDA_MODULE_LOADING=LAZY
      - PYTHONUNBUFFERED=1
      - SHM_NAME=conecsa_frame_shm
      - STEREO_COMBINE=none
      - STEREO_BLEND_ALPHA=0.5
      - GATEWAY_ADDR=http://api-gateway:5000
      - TRAIN_BATCH=4
      - TRAIN_WORKERS=0
      - TRAIN_STALL_TIMEOUT_SEC=3600
      - YOLO_AUTOINSTALL=false
      - SAM3_CHECKPOINT=/app/training-service/assets/sam3.pt
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128,garbage_collection_threshold:0.8
    volumes:
      - training-data:/data/training
    depends_on:
      - os-base
      - webcam-server
      - api-gateway
    restart: unless-stopped
    networks:
      - conecsa-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50071), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  system-vision:
    build:
      context: .
      dockerfile: system-vision/Dockerfile.system-vision.dev
    container_name: conecsa-system-vision
    ports:
      - "${SYSTEM_VISION_PORT:-80}:80"
      - "${SYSTEM_VISION_TLS_PORT:-443}:443"
    volumes:
      - conecsa-certs:/etc/conecsa/certs
    depends_on:
      - inference-service
    restart: unless-stopped
    networks:
      - conecsa-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  flow:
    build:
      context: ./flow
      dockerfile: Dockerfile
    container_name: conecsa-flow
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - INFERENCE_URL=${INFERENCE_URL:-http://api-gateway:5000}
      # Fixed development secret (production requires a real per-deployment one).
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET:-conecsa-dev-only-secret}
      # The editor is published on the host below, so keep it usable without
      # a token in development. Set FLOW_ADMIN_AUTH=1 to exercise the tokens.
      - FLOW_ADMIN_AUTH=${FLOW_ADMIN_AUTH:-0}
    ports:
      # Dev convenience: publishes the (unauthenticated) editor on the host.
      - "${FLOW_PORT:-1880}:1880"
    volumes:
      - flow-data:/data
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - conecsa-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1880"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  conecsa-network:
    driver: bridge

volumes:
  models-data:
    name: conecsa-models-data
  detections-data:
    name: conecsa-detections-data
  audit-data:
    name: conecsa-audit-data-dev
  runs-data:
    name: conecsa-runs-data
  training-data:
    name: conecsa-training-data
  flow-data:
    name: conecsa-flow-data
  conecsa-certs:
    name: conecsa-certs-dev
