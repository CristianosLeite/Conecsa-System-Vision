# Enforcing TLS block (active once the device is paired). Terminates TLS with the
# hub-signed device certificate and REQUIRES a client certificate signed by the
# hub CA (mTLS) — so only the hub can reach the device, regardless of network/IP.
# Proxies the WASM UI, the api-gateway and Node-RED behind that single gate.
server {
    listen 443 ssl;
    # Format defined in nginx.conf (conf.d/default.conf): no Referer, no query.
    access_log /var/log/nginx/access.log conecsa;
    server_name _;

    # Re-resolve upstream service names at request time (via Docker's embedded
    # DNS) so a redeployed api-gateway/flow with a new IP doesn't 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Baseline browser hardening. A device-UI CSP is
    # drafted below but ships disabled pending on-device validation of the
    # WASM/OpenCV worker requirements in the Tauri webview:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    # no-referrer: the hub opens the device UI with a ?cap= capability, and a
    # Referer would carry it into every log that records one.
    add_header Referrer-Policy no-referrer always;

    ssl_certificate        /etc/conecsa/certs/device.crt;
    ssl_certificate_key    /etc/conecsa/certs/device.key;
    ssl_client_certificate /etc/conecsa/certs/ca.crt;
    ssl_verify_client      on;

    # Allow large multipart uploads (model .pt/.onnx/.engine files, dataset ZIPs)
    # to reach the api-gateway. Without this nginx caps bodies at its 1m default
    # and rejects the upload with 413 before Flask sees it. Kept in sync with the
    # gateway's MAX_CONTENT_LENGTH (api-gateway/gateway/app.py).
    client_max_body_size 600m;

    # WASM frontend.
    # The hashed bundles may be cached for ever, the page that names them may
    # not: a stale index.html keeps pointing a browser (or the hub's webview) at
    # the previous build after a deploy. `expires` rather than `add_header`, so
    # the server-level hardening headers are still inherited here.
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # api-gateway (REST + MJPEG + SSE). Disable buffering so the streaming
    # endpoints (video_feed*, events/stream) flush immediately. Variable upstream
    # forces per-request resolution.
    location /api/ {
        set $api_upstream api-gateway;
        proxy_pass http://$api_upstream:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Stamp the verified client-cert result (always SUCCESS here, since
        # ssl_verify_client is on): the gateway uses it to tell hub pulls from
        # local snapshot consumers for the offline-buffer heartbeat, and to
        # decide whether to trust the X-Conecsa-User/-Role identity the hub
        # stamps on forwarded requests.
        proxy_set_header X-Conecsa-Client-Verify $ssl_client_verify;
        # Peer address, for the audit trail: without this the gateway only ever
        # sees this container's IP. It is the hub's address, not the operator's
        # workstation, since the hub proxies every request on their behalf.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Enrollment renewal + unpair over the established mTLS channel. The verified
    # client result is forwarded so the gateway can authorize sensitive ops
    # (e.g. /enroll/reset) to the owning hub only.
    location /enroll/ {
        set $api_upstream api-gateway;
        proxy_pass http://$api_upstream:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Conecsa-Client-Verify $ssl_client_verify;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Node-RED (Flow), including its /flow/comms editor websocket. Node-RED is
    # configured with httpAdminRoot/httpRoot = /flow (flow/settings.js).
    location /flow/ {
        set $flow_upstream flow;
        proxy_pass http://$flow_upstream:1880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
