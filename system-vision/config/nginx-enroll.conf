# Enrollment TLS block (active until the device is paired). Serves only the
# /enroll/* endpoints over a temporary self-signed certificate; the hub connects
# with verification disabled and confirms the device key fingerprint (TOFU)
# during the one-time pairing handshake.
server {
    listen 443 ssl;
    server_name _;

    # Re-resolve the api-gateway service name at request time (Docker DNS).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Baseline browser hardening (REFACTORING.md M9). A device-UI CSP is
    # drafted below but ships disabled pending on-device validation of the
    # WASM/OpenCV worker requirements in the Tauri webview:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    ssl_certificate     /etc/conecsa/certs/snakeoil.crt;
    ssl_certificate_key /etc/conecsa/certs/snakeoil.key;

    location /enroll/ {
        set $api_upstream api-gateway;
        proxy_pass http://$api_upstream:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}
