# Internal plaintext :80 server — not published in production (only the :443 mTLS
# terminator is exposed); kept for the container healthcheck and Docker-network
# upstreams. Serves the WASM UI and proxies /api and /flow to their services.
# Upstreams use a variable + Docker's resolver so a redeployed service (new IP)
# doesn't 502.
# Access-log format for every server block (this file loads first as
# conf.d/default.conf, before the TLS block in conf.d/tls.conf): no Referer and
# $uri instead of $request, so a ?cap= capability is never written to the log.
log_format conecsa '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log conecsa;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Baseline browser hardening. A device-UI CSP is
    # drafted below but ships disabled pending on-device validation of the
    # WASM/OpenCV worker requirements in the Tauri webview:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    # no-referrer: the hub opens the device UI with a ?cap= capability, and a
    # Referer would carry it into every log that records one.
    add_header Referrer-Policy no-referrer always;

    # Allow large multipart uploads (model .pt/.onnx/.engine files, dataset ZIPs)
    # to reach the api-gateway. Without this nginx caps bodies at its 1m default
    # and rejects the upload with 413. Kept in sync with the gateway's
    # MAX_CONTENT_LENGTH (api-gateway/gateway/app.py).
    client_max_body_size 600m;

    # Enable gzip for WASM files
    gzip on;
    gzip_types application/wasm application/javascript text/css;

    # The hashed bundles may be cached for ever, the page that names them may
    # not: a stale index.html keeps pointing a browser (or the hub's webview) at
    # the previous build after a deploy. `expires` rather than `add_header`, so
    # the server-level hardening headers are still inherited here.
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # api-gateway (REST + MJPEG + SSE). Buffering off so streams flush immediately.
    location /api/ {
        set $api_upstream api-gateway;
        proxy_pass http://$api_upstream:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Plaintext clients are never the hub: clear the verified-client header
        # so it cannot be spoofed past the mTLS terminator, and clear the
        # identity headers with it — only the hub may name the operator, and it
        # reaches the device over mTLS.
        proxy_set_header X-Conecsa-Client-Verify "";
        proxy_set_header X-Conecsa-User "";
        proxy_set_header X-Conecsa-Role "";
        proxy_set_header X-Conecsa-Origin-Ip "";
        # Peer address, for the audit trail.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Node-RED (Flow), served under /flow (httpAdminRoot=/flow).
    location /flow/ {
        set $flow_upstream flow;
        proxy_pass http://$flow_upstream:1880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
