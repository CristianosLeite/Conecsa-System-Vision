# Realtek RTL8822CE (NVIDIA vendor driver): select channel plan 0x62 from the
# patched /lib/firmware/rtl8822_setting.bin (see the tegra-firmware bbappend
# in meta-conecsa). The plan lets band 1 (36-48) start an access point; the
# driver has no country table, so wpa_supplicant's country= cannot do this.
# Without the patched file the driver logs "unsupported sw_chplan:0x62" and
# stays on the world-wide plan, so this option is harmless on a stock blob.
options rtl8822ce rtw_channel_plan=0x62
