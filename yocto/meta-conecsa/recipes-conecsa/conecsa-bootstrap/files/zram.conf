# /etc/default/zram — overrides for zram-swap-init (meta-openembedded/zram_0.2.bb)
#
# Purpose: in-RAM compressed swap that absorbs glibc heap fragmentation peaks
# (the inference-service's .pt -> .onnx -> .engine conversion and TensorRT
# worker, training runs). Without zram the Yocto host has no swap at all and
# RSS grows until OOM (JetPack ships nvzramconfig for the same purpose).
#
# IMPORTANT: lzo-rle is the kernel default (CONFIG_ZRAM_DEF_COMP) and the only
# algorithm every fielded L4T kernel is guaranteed to have. zstd is not built
# in, and lz4 (the zram-swap-init default) is missing on some kernels. An
# unavailable algorithm makes zramctl fail with "failed to set algorithm:
# Invalid argument", so the device runs without swap and can freeze under a
# heavy training run.
#
# Values are consumed by zram-swap-init (meta-openembedded/.../zram-swap-init).

ZRAM_SIZE_PERCENT=50
ZRAM_ALGORITHM=lzo-rle
