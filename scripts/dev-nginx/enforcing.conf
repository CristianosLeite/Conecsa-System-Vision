# Dev twin of system-vision/config/nginx-enforcing.conf. Same mTLS gate the
# paired device runs, with the Docker-DNS upstreams replaced by the host's
# services (host networking): api-gateway :5000, trunk dev server :18080
# (instead of the baked static WASM), Node-RED :1880 if running.
server {
    listen 443 ssl;
    server_name _;

    # Baseline browser hardening (REFACTORING.md M9). A device-UI CSP is
    # drafted below but ships disabled pending on-device validation of the
    # WASM/OpenCV worker requirements in the Tauri webview:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    ssl_certificate        /etc/conecsa/certs/device.crt;
    ssl_certificate_key    /etc/conecsa/certs/device.key;
    ssl_client_certificate /etc/conecsa/certs/ca.crt;
    ssl_verify_client      on;

    # Allow large multipart uploads (model files, dataset ZIPs); kept in sync
    # with the gateway's MAX_CONTENT_LENGTH (api-gateway/gateway/app.py).
    client_max_body_size 600m;

    # WASM frontend — served live by trunk in dev (hot reload included).
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # api-gateway (REST + MJPEG + SSE). Buffering off so streaming endpoints
    # flush immediately.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Conecsa-Client-Verify $ssl_client_verify;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Enrollment renewal + unpair over the established mTLS channel.
    location /enroll/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Conecsa-Client-Verify $ssl_client_verify;
    }

    # Node-RED (Flow) when it is running locally.
    location /flow/ {
        proxy_pass http://127.0.0.1:1880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
