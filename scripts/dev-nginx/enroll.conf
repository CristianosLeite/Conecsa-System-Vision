# Dev twin of system-vision/config/nginx-enroll.conf. Same enrollment TLS block
# the device runs before pairing, with the Docker-DNS upstream replaced by the
# host's api-gateway (the container runs with host networking).
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/conecsa/certs/snakeoil.crt;
    ssl_certificate_key /etc/conecsa/certs/snakeoil.key;

    location /enroll/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}
