# Dev twin of system-vision/config/nginx-enroll.conf. Same enrollment TLS block
# the device runs before pairing, with the Docker-DNS upstream replaced by the
# host's api-gateway (the container runs with host networking).
server {
    listen 443 ssl;
    server_name _;

    # Baseline browser hardening (REFACTORING.md M9). A device-UI CSP is
    # drafted below but ships disabled pending on-device validation of the
    # WASM/OpenCV worker requirements in the Tauri webview:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    ssl_certificate     /etc/conecsa/certs/snakeoil.crt;
    ssl_certificate_key /etc/conecsa/certs/snakeoil.key;

    location /enroll/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}
