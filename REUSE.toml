version = 1

# Licensing layers (see LICENSE, LICENSES/ and the per-directory LICENSE files).
# Source files carry SPDX headers; these annotations cover what cannot hold a
# comment (JSON, Markdown, HTML, images, fonts, lockfiles, generated files) and
# directories annotated here as a whole. A file header, or a REUSE.toml in a
# subdirectory, is closer and takes precedence.

# The application stack: AGPL-3.0-only.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Conecsa"
SPDX-License-Identifier = "AGPL-3.0-only"

# Contracts, shared assets, reusable libraries, tooling and docs: Apache-2.0.
# They never import AGPL code (scripts/check-licenses.sh enforces it).
[[annotations]]
path = [
    "proto/**",
    "styles/**",
    "i18n/**",
    "os-base/conecsa_shm/**",
    "os-base/conecsa_common/**",
    "flow/nodes/conecsa-system-vision/**",
    "scripts/**",
    "yocto/**",
    "docs/**",
    "system-vision/styles.css",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Conecsa"
SPDX-License-Identifier = "Apache-2.0"

# Third-party fonts bundled with the device UI.
[[annotations]]
path = "system-vision/public/Inter-latin-variable.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "system-vision/public/Good Times Rg.otf"
precedence = "override"
SPDX-FileCopyrightText = "Typodermic Fonts"
SPDX-License-Identifier = "LicenseRef-Typodermic-Commercial"

# Private agent instructions, never exported.
[[annotations]]
path = ["AGENTS.md", "CLAUDE.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Conecsa"
SPDX-License-Identifier = "LicenseRef-Conecsa-Proprietary"
